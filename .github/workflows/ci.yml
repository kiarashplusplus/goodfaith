name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  program:
    name: Program (fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads rust-toolchain.toml (1.99.1 with rustfmt and clippy).
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Format
        run: cargo fmt --all --check
      # `cargo test` and `clippy --all-targets` need target/deploy/goodfaith.so:
      # tests/goodfaith.rs include_bytes!() the built program, which needs the Anchor
      # CLI (`anchor build --arch v2`). That toolchain isn't installed here, so CI
      # lints the library crate only. Run `anchor build --arch v2 && anchor test
      # --skip-build` locally before merging program changes.
      - name: Clippy
        working-directory: programs/goodfaith
        run: cargo clippy --lib --no-deps -- -D warnings

  program-tests:
    name: Program tests (Anchor build, Rust + Node LiteSVM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOLANA_VERSION: "4.3.2"
      ANCHOR_VERSION: "1.2.1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Cache Solana CLI, platform-tools and Anchor
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana/install
            ~/.cache/solana
            ~/.local/bin/anchor
          key: solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}-${{ runner.os }}
      - name: Install toolchain (Solana CLI + Anchor; platform-tools on first build)
        run: bash scripts/toolchain.sh --no-surfpool
      - name: Add toolchain to PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build program
        run: anchor build --arch v2
      - name: Rust tests (LiteSVM + property tests)
        run: cargo test -p goodfaith
      - name: Clippy, all targets
        run: cargo clippy --all-targets -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: App on-chain tests (LiteSVM)
        working-directory: app
        run: npm ci && npm run test:svm

  app:
    name: Web app (lint, types, tests, build, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      # Mirrors app/.env.example so the build is deterministic.
      NEXT_PUBLIC_CLUSTER: devnet
      NEXT_PUBLIC_RPC_URL: https://api.devnet.solana.com
      NEXT_PUBLIC_POOL_MINT: 4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU
      NEXT_PUBLIC_PROGRAM_ID: BM71D4Kdnq3Mtc2cqDuMBLyYguFihDqsjk9btdTWtoRd
      NEXT_PUBLIC_POOL_AUTHORITY: none
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # Blocks on new high/critical advisories in production dependencies; the full report is informational.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit
        continue-on-error: true
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('scripts/package-lock.json') }}
      - name: Smoke (page load of every route)
        working-directory: scripts
        run: |
          npm ci
          npx playwright-core install chromium
          (cd ../app && PORT=3100 npm start > /tmp/app.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3100/fund && break; sleep 1; done
          APP_URL=http://127.0.0.1:3100 npm run smoke

  # Long job: Surfpool devnet fork + Kora. Runs on pushes to main and by hand (Actions > CI > Run workflow);
  # it depends on public devnet RPC from the runner, so a rate-limit flake is possible: re-run it.
  e2e:
    name: End to end (Surfpool fork, Kora direct and through the proxy, smoke)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [program-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOLANA_VERSION: "4.3.2"
      ANCHOR_VERSION: "1.2.1"
      SURFPOOL_VERSION: "1.6.1"
      KORA_VERSION: "2.0.5"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Cache Solana CLI, platform-tools, Anchor and Surfpool
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana/install
            ~/.cache/solana
            ~/.local/bin/anchor
            ~/.local/bin/surfpool
          key: solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}-surfpool-${{ env.SURFPOOL_VERSION }}-${{ runner.os }}
      - name: Cache Kora
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/kora
          key: kora-${{ env.KORA_VERSION }}-${{ runner.os }}
      - name: Install toolchain (with Kora)
        run: bash scripts/toolchain.sh --with-kora
      - name: Add toolchain to PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: anchor build --arch v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            scripts/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: scripts
      - name: Start a Surfpool fork of devnet
        run: |
          nohup surfpool start --network devnet --no-tui --no-deploy -a "$(solana address)" -q 100000000000 > /tmp/surfpool.log 2>&1 &
          for i in $(seq 1 90); do
            curl -s -m 3 http://127.0.0.1:8899 -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' | grep -q ok && exit 0
            sleep 2
          done
          echo "surfpool did not come up"; tail -50 /tmp/surfpool.log; exit 1
      - name: Plant the program, create the gatekeeper network and run the loan-cycle e2e
        working-directory: scripts
        run: npm run deploy-fork && npm run gatekeeper-setup && npm run e2e
      - name: Validate the Kora policy and start Kora without auth (development mode)
        run: |
          solana-keygen new --no-bip39-passphrase --silent -o /tmp/kora-signer.json
          kora --config scripts/kora/kora.toml config validate
          export KORA_PRIVATE_KEY="$(cat /tmp/kora-signer.json)"
          nohup kora --config scripts/kora/kora.toml --rpc-url http://127.0.0.1:8899 rpc start --signers-config scripts/kora/signers.toml --port 8080 > /tmp/kora.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8080/liveness && exit 0; sleep 1; done
          echo "kora did not come up"; tail -50 /tmp/kora.log; exit 1
      - name: Sponsored e2e, direct to Kora
        working-directory: scripts
        run: KORA_URL=http://127.0.0.1:8080 npm run kora-e2e
      - name: Restart Kora with auth and start the app in front of it
        run: |
          pkill -f "kora --config" || true
          sleep 1
          export KORA_PRIVATE_KEY="$(cat /tmp/kora-signer.json)"
          export KORA_HMAC_SECRET="$(openssl rand -hex 32)"
          export KORA_API_KEY="$(openssl rand -hex 16)"
          echo "::add-mask::$KORA_HMAC_SECRET"; echo "::add-mask::$KORA_API_KEY"
          nohup kora --config scripts/kora/kora.toml --rpc-url http://127.0.0.1:8899 rpc start --signers-config scripts/kora/signers.toml --port 8080 > /tmp/kora-auth.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8080/liveness && break; sleep 1; done
          cd app
          export NEXT_PUBLIC_RPC_URL=http://127.0.0.1:8899
          export NEXT_PUBLIC_KORA_URL=/api/sponsor
          export NEXT_PUBLIC_GATEKEEPER_NETWORK="$(node -e 'console.log(require("../scripts/e2e-result.json").network)')"
          export NEXT_PUBLIC_POOL_AUTHORITY="$(node -e 'const r=require("../scripts/e2e-result.json"); console.log(r.authority)')"
          npm run build
          # Identity issuer in mock mode: the admin key is the pool's issuer and the network's gatekeeper on the fork.
          export IDENTITY_PROVIDER=mock IDENTITY_DB_PATH=memory
          # The admin key is also the pool's recovery authority on the fork (launch separates the keys).
          export ISSUER_SECRET="$(cat ~/.config/solana/id.json)" GATEKEEPER_SECRET="$(cat ~/.config/solana/id.json)" RECOVERY_SECRET="$(cat ~/.config/solana/id.json)"
          export PERSON_HASH_SECRET="$(openssl rand -hex 32)" IDENTITY_ADMIN_KEY="$(openssl rand -hex 16)"
          echo "::add-mask::$PERSON_HASH_SECRET"; echo "::add-mask::$IDENTITY_ADMIN_KEY"
          echo "IDENTITY_ADMIN_KEY=$IDENTITY_ADMIN_KEY" >> "$GITHUB_ENV"
          # The e2e sends ~16 sponsored transactions in a minute; give the per-client limiter room and tell the e2e the value.
          KORA_URL=http://127.0.0.1:8080 SPONSOR_RATE_CAPACITY=120 IDENTITY_RATE_CAPACITY=200 PORT=3100 nohup npm start > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3100/fund && exit 0; sleep 1; done
          echo "app did not come up"; tail -50 /tmp/app.log; exit 1
      - name: Sponsored e2e through the proxy (HMAC + API key), the identity join flow, then smoke
        working-directory: scripts
        run: |
          APP_URL=http://127.0.0.1:3100 npm run identity-e2e
          APP_URL=http://127.0.0.1:3100 npm run cranker-e2e
          KORA_URL=http://127.0.0.1:3100/api/sponsor KORA_DIRECT_URL=http://127.0.0.1:8080 SPONSOR_RATE_CAPACITY=120 npm run kora-e2e
          npx playwright-core install chromium
          APP_URL=http://127.0.0.1:3100 npm run smoke
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            /tmp/surfpool.log
            /tmp/kora.log
            /tmp/kora-auth.log
            /tmp/app.log
