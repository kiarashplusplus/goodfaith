# Kora fee-sponsor config for Good Faith (kora-cli 2.0.5). Sponsorship is free for users; policy below
# limits what the sponsor will pay for. Check it with: kora config validate --config scripts/kora/kora.toml
#
# For mainnet change: the program id in allowed_programs, the mint in allowed_tokens, rate_limit (it is a
# single global requests-per-second cap, lower it), the signer type in signers.toml (memory -> Turnkey/Privy),
# and turn on [kora.cache] with a Redis URL.
#
# Network exposure: Kora 2.0.5 answers any origin (CORS is allow-any and not configurable). Do not expose
# this port publicly. The web app's /api/sponsor route is the origin and auth boundary: it forwards only
# getPayerSigner, signAndSendTransaction and liveness, rate-limits per client, and signs requests with
# the credentials Kora reads from the environment: KORA_API_KEY and/or KORA_HMAC_SECRET (HMAC-SHA256 of
# timestamp + body, accepted within 300 s). Set the same values for the app server and for Kora.

[kora]
rate_limit = 100

[kora.cache]
enabled = false
default_ttl = 300
account_ttl = 60

# Only what the app calls. get_config would publish this policy; the rest is unused.
[kora.enabled_methods]
liveness = true
estimate_transaction_fee = false
get_supported_tokens = false
sign_transaction = false
sign_and_send_transaction = true
transfer_transaction = false
get_blockhash = false
get_config = false
get_payer_signer = true

[validation]
# Fee payer outflow per transaction, rent created through CPI included. The largest sponsored transaction is a
# first co-sign: borrower token account 2_039_280 + Loan (389 bytes) 3_598_320 + escrow 2_039_280 = 7_676_880 lamports,
# plus fee headroom. Rent returned by closing accounts does not count against this.
max_allowed_lamports = 8_000_000
# Kora + the wallet + the issuer on a registration (recovery proposals are sent by the operator's CLI; the app's proxy only lets extra
# signers through on Good Faith instructions).
max_signatures = 4
price_source = "Mock"
allow_durable_transactions = false
allowed_programs = [
    "11111111111111111111111111111111",
    "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA",
    "ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL",
    "ComputeBudget111111111111111111111111111111",
    "BvYSoBvDqLGrnrMqSpPguFkApyNTTj219mLWQGnrkCGq",
]
allowed_tokens = ["4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU"]
allowed_spl_paid_tokens = ["4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU"]
disallowed_accounts = []

# What the fee payer itself may do inside a sponsored transaction: pay rent (create/assign/allocate), nothing else.
[validation.fee_payer_policy.system]
allow_transfer = false
allow_assign = true
allow_create_account = true
allow_allocate = true

[validation.fee_payer_policy.spl_token]
allow_transfer = false
allow_burn = false
allow_close_account = false
allow_approve = false
allow_revoke = false
allow_set_authority = false
allow_mint_to = false
allow_initialize_mint = false
allow_initialize_account = false
allow_initialize_multisig = false
allow_freeze_account = false
allow_thaw_account = false

[validation.price]
type = "free"

[validation.token2022]
# Classic USDC only, but block the one Token-2022 extension that lets an issuer seize funds anyway.
blocked_mint_extensions = ["permanent_delegate"]
blocked_account_extensions = []

# Lifetime count per wallet with no time window: a member would be locked out after a few actions.
# Keep off; per-client limiting lives in the app's /api/sponsor proxy.
[kora.usage_limit]
enabled = false
cache_url = "redis://localhost:6379"
max_transactions = 0
fallback_if_unavailable = true

[metrics]
enabled = true
endpoint = "/metrics"
port = 8081
scrape_interval = 30

[metrics.fee_payer_balance]
enabled = true
expiry_seconds = 30
